name: Deploy to GitHub Pages

# 將 index.html 與 trade/ 同步到 gh-pages 分支;GitHub Pages 由該分支提供服務。
on:
  push:
    branches:
      - main
      - claude/llm-token-education-site-909mo9
    paths:
      - index.html
      - 'trade/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git rm -rf --quiet .
          git checkout "${GITHUB_SHA}" -- index.html trade
          touch .nojekyll
          git add index.html trade .nojekyll
          git commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --force origin deploy:gh-pages
