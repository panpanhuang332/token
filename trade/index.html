<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國貿大會考 14 天衝刺</title>
<meta name="description" content="國際貿易大會考兩週衝刺:12 大命題方向講義、仿真練習題逐題詳解、隨機計算題產生器、貿易英文單字卡、計時模擬考、考古題匯入與錯題本。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--ink:#16213e;--muted:#5e6880;--line:#dfe5f0;
  --navy:#16213e;--coral:#ef6c3d;--coral-bg:#ffe9e0;--teal:#0f9d8a;--teal-bg:#dcf5f0;
  --gold:#e9a825;--gold-bg:#fff3d1;--blue:#2e5bff;--blue-bg:#e3eaff;--red:#c8324f;--red-bg:#fde6ea;
  --violet:#6b4fd8;--violet-bg:#ebe6fb;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.85;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button,input,select,textarea{font-family:var(--sans);font-size:15px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{line-height:1.4}
h2{font-size:clamp(22px,5vw,30px);font-weight:900;margin:0 0 6px}
h3{font-size:18px;font-weight:900;margin:22px 0 10px}
h4{font-size:16px;font-weight:900;margin:18px 0 8px;color:var(--navy)}
p{margin:0 0 .9em}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 14px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#eef2f9;font-weight:700}
.tablewrap,.notes table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.notes table{white-space:normal;min-width:0}
ul,ol{padding-left:1.4em;margin:0 0 .9em}
li{margin:.3em 0}
code{font-family:var(--mono);font-size:.93em}
.mono{font-family:var(--mono)}
.tiny{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin:14px 0}
.metaphor{border-left:6px solid var(--gold);background:linear-gradient(0deg,#fff,#fffaf0)}
.metaphor .tag,.deftag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 12px;margin-bottom:6px;background:var(--gold-bg);color:#8a5d00}
.def{border-left:6px solid var(--blue)}.def .deftag{background:var(--blue-bg);color:var(--blue)}
.example{border-left:6px solid var(--teal)}.example .deftag{background:var(--teal-bg);color:var(--teal)}
.advanced{border-left:6px solid var(--violet)}.advanced .deftag{background:var(--violet-bg);color:var(--violet)}
.notice{background:var(--gold-bg);border:1px solid #f0d48a;color:#7a4e00;border-radius:12px;padding:12px 16px;font-size:14.5px;margin:12px 0}
.warn{background:var(--red-bg);border:1px solid #f0b4c0;color:#8a1f37;border-radius:12px;padding:12px 16px;font-size:14.5px;margin:12px 0}
.btn{cursor:pointer;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;border-radius:10px;padding:8px 16px;font-size:14.5px}
.btn:hover{background:var(--blue-bg)}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--blue);border-color:var(--blue)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}.btn.coral:hover{filter:brightness(1.08)}
.btn.small{padding:5px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:700}
.pill.teal{background:var(--teal-bg);color:var(--teal)}.pill.coral{background:var(--coral-bg);color:#b8461c}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.gold{background:var(--gold-bg);color:#8a5d00}.pill.red{background:var(--red-bg);color:var(--red)}.pill.violet{background:var(--violet-bg);color:var(--violet)}
/* header */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:960px;margin:0 auto}
.brand{font-weight:900;font-size:16px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--coral)}
.countdown{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;white-space:nowrap;cursor:pointer;border:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;max-width:960px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:999px;border:1.5px solid transparent}
nav.tabs a.active{background:var(--navy);color:#fff}
nav.tabs a:hover:not(.active){background:var(--blue-bg);color:var(--blue)}
main{max-width:960px;margin:0 auto;padding:18px 16px 80px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}
.modcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.modcard:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(46,91,255,.12)}
.modcard .ic{font-size:26px;flex:none}
.modcard .t{font-weight:900}
.modcard .s{font-size:13px;color:var(--muted)}
.modcard .st{font-family:var(--mono);font-size:12px;color:var(--teal);margin-top:2px}
.hero{background:linear-gradient(135deg,#16213e 0%,#2b3a6e 60%,#3d4f8f 100%);color:#fff;border-radius:20px;padding:26px 22px;margin-bottom:16px}
.hero h1{font-size:clamp(26px,6.5vw,40px);font-weight:900;line-height:1.3;margin-bottom:8px}
.hero h1 span{background:var(--coral);border-radius:8px;padding:0 10px}
.hero p{color:#c9d3f0;max-width:620px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px;min-width:110px}
.stat .v{font-family:var(--mono);font-weight:700;font-size:24px;display:block;line-height:1.2}
.stat .k{font-size:12.5px;color:var(--muted)}
.bar{height:10px;background:#e6ebf5;border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:6px;transition:width .4s}
/* quiz */
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin:14px 0}
.q .qt{font-weight:700;margin-bottom:10px;line-height:1.7}
.q .qn{font-family:var(--mono);color:#fff;background:var(--navy);border-radius:7px;padding:1px 9px;font-size:13px;margin-right:8px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;line-height:1.7;color:var(--ink);font-size:15px}
.opts button:hover:not(:disabled){border-color:var(--blue)}
.opts button.correct{border-color:var(--teal);background:var(--teal-bg);font-weight:700}
.opts button.wrong{border-color:var(--red);background:var(--red-bg)}
.opts button.picked{border-color:var(--blue);background:var(--blue-bg)}
.expl{display:none;margin-top:12px;font-size:14.5px;background:var(--blue-bg);border-radius:10px;padding:10px 14px;color:#1d3fb8;line-height:1.8}
.expl.show{display:block}
.expl b{color:var(--navy)}
.steps{font-family:var(--mono);font-size:13.5px;background:#f7f9fd;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;white-space:pre-wrap;line-height:1.9}
.timer{font-family:var(--mono);font-weight:700;font-size:18px;background:var(--gold-bg);color:#8a5d00;border-radius:10px;padding:6px 14px;display:inline-block}
.timer.low{background:var(--red-bg);color:var(--red)}
/* flashcard */
.flash{perspective:1200px;max-width:560px;margin:14px auto}
.flash .inner{position:relative;min-height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:2px solid var(--navy);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.flash .back{transform:rotateY(180deg);background:var(--navy);color:#fff;border-color:var(--navy)}
.flash .w{font-size:clamp(20px,5vw,28px);font-weight:900;font-family:var(--mono)}
.flash .m{font-size:24px;font-weight:900}
.flash .n{font-size:14px;opacity:.8;margin-top:8px}
/* import */
textarea.imp{width:100%;min-height:180px;font-family:var(--mono);font-size:13px;border:2px solid var(--line);border-radius:10px;padding:10px}
input[type=number],input[type=text],input[type=date],select{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-family:var(--mono);background:#fff;width:100%}
label.f{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.calcgrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:640px){.calcgrid{grid-template-columns:1fr 1fr 1fr}}
.result{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:14px;line-height:1.9;margin-top:10px;white-space:pre-wrap}
.daycard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.daycard.done{border-color:var(--teal);background:#f3fbf9}
.daycard .dh{display:flex;align-items:center;gap:10px;font-weight:900}
.daycard .dn{font-family:var(--mono);background:var(--coral);color:#fff;border-radius:8px;padding:1px 10px;font-size:13px}
.daycard label{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;margin:6px 0;cursor:pointer}
.daycard input{width:18px;height:18px;margin-top:5px;accent-color:var(--teal);flex:none}
.ctx{background:#f7f9fd;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:14.5px;white-space:pre-wrap}
.qtable{margin:0 0 10px}
.qtable table{font-size:13.5px}
.srcpg{font-size:12.5px;color:var(--muted);margin-top:8px}
.note{background:var(--gold-bg);border-radius:8px;padding:8px 12px;margin-top:8px;color:#7a4e00;font-size:14px}
.lightbox{position:fixed;inset:0;background:rgba(10,14,30,.92);z-index:100;overflow:auto;padding:16px}
.lightbox .lbin{max-width:960px;margin:0 auto}
.lightbox img{width:100%;background:#fff;border-radius:8px;margin:10px 0}
.lightbox .lbbar{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;position:sticky;top:0;background:rgba(10,14,30,.9);padding:6px 0}
.edcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.edcard .eh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:900;font-size:17px}
footer{text-align:center;font-size:13px;color:var(--muted);padding:30px 16px;border-top:1px solid var(--line);margin-top:40px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="brand" href="#/home">國貿大會考 <b>14 天衝刺</b></a>
    <button class="countdown" id="countdown" title="設定考試日期">設定考試日期</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/home">首頁</a><a href="#/plan">14 天計畫</a><a href="#/notes">講義</a><a href="#/practice">練習</a><a href="#/calc">計算題</a><a href="#/vocab">單字卡</a><a href="#/exam">模擬考</a><a href="#/past">考古題</a><a href="#/wrong">錯題本</a><a href="#/cheat">速記表</a>
  </nav>
</header>
<main id="app"></main>
<footer>本站為個人備考用的教學練習網站,題目為依官方公布之 12 大命題方向自行編寫的仿真練習題,非主辦單位原題。官方資訊請以台北市進出口商業同業公會「國際貿易大會考」網站為準。</footer>
<script src="bank.js"></script>
<script src="past_data.js"></script>
<script>
'use strict';
/* ========== 工具 ========== */
const $=(s,el=document)=>el.querySelector(s);const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=(n,d=2)=>Number(n).toLocaleString('zh-Hant-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b,step=1)=>a+Math.floor(Math.random()*((b-a)/step+1))*step;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem('itce.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('itce.'+k,JSON.stringify(v));}catch(e){}}};
const app=$('#app');
const ALLQ=[];BANK.modules.forEach(m=>m.questions.forEach((q,i)=>{q.id=m.id+'-'+i;q.mod=m.id;ALLQ.push(q);}));
const modById=id=>BANK.modules.find(m=>m.id===id);

/* 統計:stats[qid]={t:嘗試,c:正確}; wrong: [qid] */
function recordAnswer(q,ok){const st=store.get('stats',{});const s=st[q.id]||{t:0,c:0};s.t++;if(ok)s.c++;st[q.id]=s;store.set('stats',st);
  let w=store.get('wrong',[]);if(!ok){if(!w.includes(q.id))w.push(q.id);}else{w=w.filter(x=>x!==q.id);}store.set('wrong',w);}
function modStats(mid){const st=store.get('stats',{});let t=0,c=0,n=0;ALLQ.filter(q=>q.mod===mid).forEach(q=>{const s=st[q.id];if(s){n++;t+=s.t;c+=s.c;}});return{done:n,t,c,acc:t?Math.round(c/t*100):null};}

/* ========== 題目渲染(共用) ========== */
function renderQuestion(q,idx,opts={}){
  const div=document.createElement('div');div.className='q';div.dataset.qid=q.id||'';
  const src=q.src?`<span class="pill gold" style="margin-left:6px">${esc(q.src)}</span>`:'';
  const modName=q.mod&&modById(q.mod)?`<span class="pill blue" style="margin-left:6px">${esc(modById(q.mod).name)}</span>`:'';
  const ctx=q.context?`<div class="ctx">${esc(q.context)}</div>`:'';
  const tbl=q.table&&q.table.headers?`<div class="qtable tablewrap"><table><tr>${q.table.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${(q.table.rows||[]).map(r=>`<tr>${(Array.isArray(r)?r:Object.values(r)).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:'';
  const hist=q.historical?'<span class="pill red" style="margin-left:6px">依當屆時事作答</span>':'';
  const caseBtn=(q.exam&&q.number>=91&&window.PAST&&PAST.editions[q.exam]&&PAST.editions[q.exam].casePages.length)?`<div class="btnrow"><button type="button" class="btn small" data-case="${esc(q.exam)}">📎 查看第 ${esc(q.exam)} 屆單證附件(${PAST.editions[q.exam].casePages.length} 頁)</button></div>`:'';
  div.innerHTML=`<div class="qt"><span class="qn">${q.number||idx+1}</span>${esc(q.q)}${opts.showMod?modName:''}${src}${hist}</div>${ctx}${tbl}${caseBtn}
    <div class="opts">${q.o.map((o,i)=>`<button type="button" data-i="${i}">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>
    <div class="expl"></div>`;
  const cb=$('[data-case]',div);if(cb)cb.addEventListener('click',()=>openCasePages(cb.dataset.case));
  const btns=$$('.opts button',div),expl=$('.expl',div);
  btns.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(opts.deferred){btns.forEach(x=>x.classList.remove('picked'));b.classList.add('picked');div.dataset.picked=i;if(opts.onPick)opts.onPick(q,i);return;}
    if(div.dataset.done)return;div.dataset.done='1';
    btns.forEach(x=>x.disabled=true);
    const ok=i===q.a;btns[q.a].classList.add('correct');if(!ok)b.classList.add('wrong');
    expl.innerHTML=(ok?'✅ 答對了!':'❌ 不對,正解是 <b>'+'ABCD'[q.a]+'</b>。')+'<br>'+(q.e?esc(q.e):'<i>此題尚無詳解(匯入的考古題)。可到對應章節講義複習。</i>')+(q.steps?`<div class="steps">${esc(q.steps)}</div>`:'')+extraExpl(q);
    expl.classList.add('show');
    if(q.id&&!opts.noRecord)recordAnswer(q,ok);
    if(opts.onAnswer)opts.onAnswer(q,ok);
  }));
  return div;
}
function extraExpl(q){let h='';if(q.note)h+=`<div class="note">📝 校核註記:${esc(q.note)}</div>`;if(q.historical)h+=`<div class="note">🕰 本題依「當屆」的時事與規定作答,現行規則可能已不同。</div>`;
  if(q.exam){h+=`<div class="srcpg">來源:第 ${esc(q.exam)} 屆第 ${q.number} 題${q.page?`(原卷 PDF 第 ${esc(q.page)} 頁)`:''} · 解析為本站編寫,非主辦單位官方解析${q.topic&&pastTopic(q.topic)?` · 題型:<a href="#/lesson/${esc(q.topic)}">${esc(pastTopic(q.topic).title||pastTopic(q.topic).name||q.topic)}</a>`:''}</div>`;}return h;}
function pastTopic(id){return window.PAST&&PAST.curriculum.find(t=>String(t.id)===String(id));}
function openCasePages(ex){const ed=window.PAST&&PAST.editions[ex];if(!ed)return;const lb=document.createElement('div');lb.className='lightbox';
  lb.innerHTML=`<div class="lbin"><div class="lbbar"><span>第 ${esc(ex)} 屆單證附件(第 91~100 題用)</span><button class="btn small" style="margin-left:auto;background:#fff" data-close>關閉 ✕</button></div>${ed.casePages.map((p,i)=>`<p style="color:#c9d3f0;margin:6px 0 0">第 ${i+1} 頁</p><img src="${esc(p)}" alt="第 ${esc(ex)} 屆單證附件第 ${i+1} 頁" data-path="${esc(p)}">`).join('')}</div>`;
  $$('img',lb).forEach(img=>img.addEventListener('error',()=>{const d=document.createElement('div');d.className='notice';d.textContent='此頁附件影像尚未上傳('+img.dataset.path+')。請對照官方原卷 PDF 的第 91~100 題附件作答。';img.replaceWith(d);}));
  lb.addEventListener('click',e=>{if(e.target===lb||e.target.hasAttribute('data-close'))lb.remove();});document.body.appendChild(lb);}
/* 套件題目 → 網站題目格式(id 加前綴避免衝突) */
const PASTQ=(window.PAST?PAST.questions:[]).map(q=>({...q,id:'P-'+q.id,src:'第 '+q.exam+' 屆'}));
function revealQuestion(div,q){const btns=$$('.opts button',div),expl=$('.expl',div);const p=div.dataset.picked;btns.forEach(x=>x.disabled=true);btns[q.a].classList.add('correct');
  const ok=p!==undefined&&+p===q.a;if(p!==undefined&&!ok)btns[+p].classList.add('wrong');
  expl.innerHTML=(p===undefined?'⚠ 未作答。':ok?'✅ 答對。':'❌ 答錯,')+'正解 <b>'+'ABCD'[q.a]+'</b>。<br>'+(q.e?esc(q.e):'<i>此題尚無詳解。</i>')+extraExpl(q);expl.classList.add('show');
  if(q.id)recordAnswer(q,ok);return ok;}

/* ========== 頁面:首頁 ========== */
function viewHome(){
  const st=store.get('stats',{});const answered=Object.keys(st).length;const tot=ALLQ.length;

    <div class="btnrow" style="margin-top:20px"><a class="btn" href="#/practice">回章節列表</a><a class="btn primary" href="#/wrong">去錯題本</a></div>`;

}

function makeCalcQuestion(type){const t=type==='mix'?pick(CALC):CALC.find(c=>c.id===type);const g=t.gen();const d=g.int?0:2;
  let ws=g.wrong.map(w=>g.int?Math.round(w):w).filter(w=>Math.abs(w-g.ans)>(g.int?0.5:0.005*Math.max(1,g.ans)));const seen=new Set([fmt(g.ans,d)]);ws=ws.filter(w=>{const k=fmt(w,d);if(seen.has(k))return false;seen.add(k);return true;});
  let guard=0;while(ws.length<3&&guard<50){guard++;const base=Math.abs(g.ans)||100;const w=g.ans+base*pick([-0.15,0.15,0.3,-0.3,0.5,0.8])*(1+guard*0.07);const k=fmt(w,d);if(!seen.has(k)&&(g.int?Math.round(w)>=0:w>=0)){seen.add(k);ws.push(w);}}
  while(ws.length<3){ws.push(g.ans+(ws.length+1)*(Math.abs(g.ans)||100));}
  const all=shuffle([g.ans,...ws.slice(0,3)]);const a=all.indexOf(g.ans);
  const unit=t.id==='duty'?'TWD ':t.id==='cont'?'':t.id==='air'||t.id==='lcl'||t.id==='cfrq'||t.id==='cif'||t.id==='fob'||t.id==='ins'||t.id==='comm'||t.id==='profit'?'USD ':'';
  return{q:g.q,o:all.map(v=>unit+fmt(v,d)+(g.int?' 箱':'')),a,e:'',steps:g.steps,type:t.name};}

  <div class="btnrow"><button class="btn primary" id="gen">出一題</button><span class="pill teal" id="cscore">0 / 0</span></div></div>
  <div id="cq"></div>

/* ========== 考古題匯入 ========== */
function parseExamText(text){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const qs=[];let cur=null;const keyMap={};
  const optRe=/^[（(]?([A-DＡ-Ｄ])[)）.、．:：]\s*(.*)$/;const startRe=/^(\d{1,3})\s*[.、．)）:：]\s*(.*)$/;const ansRe=/^(?:答案|解答|Ans(?:wer)?)\s*[:：]?\s*[（(]?([A-DＡ-Ｄ])/i;
  const norm=ch=>'ABCD'['ABCDＡＢＣＤ'.indexOf(ch)%4];
  const keyLine=/^(?:\d{1,3}\s*[.、．:：]?\s*[（(]?[A-DＡ-Ｄ][)）]?\s*[,，;；\s]*){3,}$/;
  for(const l of lines){
    if(keyLine.test(l)){const re=/(\d{1,3})\s*[.、．:：]?\s*[（(]?([A-DＡ-Ｄ])/g;let m;while((m=re.exec(l)))keyMap[+m[1]]=norm(m[2]);continue;}
    let m;
    if((m=l.match(ansRe))&&cur){cur.a='ABCD'.indexOf(norm(m[1]));continue;}
    if((m=l.match(startRe))&&!optRe.test(l)){if(cur)qs.push(cur);cur={n:+m[1],q:m[2],o:[],a:-1};
      const inline=cur.q.split(/(?=[（(][A-DＡ-Ｄ][)）])/);if(inline.length>=4){cur.q=inline[0].trim();inline.slice(1).forEach(p=>{const mm=p.match(optRe);if(mm)cur.o.push(mm[2].trim());});}continue;}
    if(optRe.test(l)&&cur){l.split(/(?=[（(][A-DＡ-Ｄ][)）])/).forEach(part=>{const mm=part.trim().match(optRe);if(mm)cur.o.push(mm[2].trim());});continue;}
    if(cur){if(cur.o.length)cur.o[cur.o.length-1]+=' '+l;else cur.q+=' '+l;}
  }
  if(cur)qs.push(cur);
  qs.forEach(q=>{if(q.a<0&&keyMap[q.n]!==undefined)q.a='ABCD'.indexOf(keyMap[q.n]);});
  return qs.filter(q=>q.o.length===4);
}

  PAST.curriculum.forEach(t=>{const n=PASTQ.filter(q=>String(q.topic)===String(t.id)).length;const b=document.createElement('button');b.className='modcard';b.innerHTML=`<span class="ic">📘</span><span><span class="t">${esc(t.title||t.name||t.id)}</span><br><span class="st">${n} 題 · <a href="#/lesson/${esc(t.id)}">看教材</a></span></span>`;b.addEventListener('click',()=>location.hash='#/pasttopic/'+t.id);$('#topics').appendChild(b);});
  const mw=$('#manualwrap');mw.innerHTML=`<div class="card"><label class="f">名稱</label><input type="text" id="pname" placeholder="例:模擬題"><label class="f">試題文字</label><textarea class="imp" id="ptext"></textarea><div class="btnrow"><button class="btn primary" id="pimp">解析並匯入</button></div><div id="pmsg" class="tiny"></div></div><div id="plist"></div>`;
  manual.forEach((p,pi)=>{const d=document.createElement('div');d.className="card";d.innerHTML=`<b>${esc(p.name)}</b> <span class="pill blue">${p.q.length} 題</span><div class="btnrow"><a class="btn primary small" href="#/pastq/m${pi}">練習</a><button class="btn small" data-del="${pi}">刪除</button></div>`;$('[data-del]',d).addEventListener('click',()=>{const arr=store.get('past',[]);arr.splice(pi,1);store.set('past',arr);viewPast();});$('#plist').appendChild(d);});
  $('#pimp').addEventListener('click',()=>{const name=$('#pname').value.trim()||'匯入';const txt=$('#ptext').value.trim();let qs=[];try{qs=txt.startsWith('[')?JSON.parse(txt):parseExamText(txt);}catch(e){qs=[];}qs=qs.filter(q=>q&&q.o&&q.o.length===4);if(!qs.length){$('#pmsg').textContent='解析失敗。';return;}const arr=store.get('past',[]);arr.push({name,q:qs.map(q=>({q:q.q,o:q.o,a:typeof q.a==='number'?q.a:'ABCD'.indexOf(String(q.a).toUpperCase()),e:q.e||''}))});store.set('past',arr);viewPast();});
}
function viewPastEdition(ex){const qs=PASTQ.filter(q=>q.exam===ex).sort((a,b)=>a.number-b.number);if(!qs.length){location.hash='#/past';return;}
  app.innerHTML=`<p class="tiny"><a href="#/past">← 考古題</a></p><h2>第 ${esc(ex)} 屆 逐題練習</h2><div class="btnrow"><span class="pill teal" id="score">0 / 0</span><a class="btn coral small" href="#/exam/${esc(ex)}">改用整卷計時模式</a>${PAST.editions[ex]&&PAST.editions[ex].casePages.length?`<button class="btn small" id="cp">📎 單證附件</button>`:''}</div><div id="list"></div>`;
  if($('#cp'))$('#cp').addEventListener('click',()=>openCasePages(ex));let c=0,t=0;qs.forEach((q,i)=>$('#list').appendChild(renderQuestion(q,i,{onAnswer:(q,ok)=>{t++;if(ok)c++;$('#score').textContent=c+' / '+t;}})));}
function viewPastTopic(tid){const t=pastTopic(tid);const qs=shuffle(PASTQ.filter(q=>String(q.topic)===String(tid)));
  app.innerHTML=`<p class="tiny"><a href="#/past">← 考古題</a> · <a href="#/lesson/${esc(tid)}">看教材</a></p><h2>題型:${esc(t?(t.title||t.name||tid):tid)}</h2><p class="tiny">${qs.length} 題,跨屆隨機排序;重複考題按屆保留。</p><span class="pill teal" id="score">0 / 0</span><div id="list"></div>`;
  let c=0,n=0;qs.forEach((q,i)=>$('#list').appendChild(renderQuestion(q,i,{onAnswer:(q,ok)=>{n++;if(ok)c++;$('#score').textContent=c+' / '+n;}})));}
function viewPastStats(){const eds=Object.keys(PAST.editions).sort((a,b)=>+a-+b);
  app.innerHTML=`<p class="tiny"><a href="#/past">← 考古題</a></p><h2>題型統計</h2><div class="notice">統計方式:每題只標一個主要題型;重複考題按屆保留;信用狀實例(第 91~100 題)獨立計數。<b>此為本站整理,不是主辦單位的官方配分。</b></div>
  <div class="tablewrap"><table><tr><th>題型</th>${eds.map(e=>`<th>第 ${esc(e)} 屆</th>`).join('')}<th>合計</th></tr>${PAST.curriculum.map(t=>{const row=eds.map(e=>PASTQ.filter(q=>q.exam===e&&String(q.topic)===String(t.id)).length);return `<tr><td><a href="#/pasttopic/${esc(t.id)}">${esc(t.title||t.name||t.id)}</a></td>${row.map(n=>`<td class="mono">${n}</td>`).join('')}<td class="mono"><b>${row.reduce((a,b)=>a+b,0)}</b></td></tr>`;}).join('')}</table></div>`;}
function renderGeneric(v,depth=0){if(v==null)return '';if(typeof v==='string')return `<p>${esc(v).replace(/\n/g,'<br>')}</p>`;if(typeof v==='number'||typeof v==='boolean')return `<p>${esc(String(v))}</p>`;
  if(Array.isArray(v)){if(!v.length)return '';if(v.every(x=>typeof x!=='object'))return `<ul>${v.map(x=>`<li>${esc(String(x))}</li>`).join('')}</ul>`;
    if(v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){const keys=[...new Set(v.flatMap(x=>Object.keys(x)))];return `<div class="tablewrap"><table><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${v.map(x=>`<tr>${keys.map(k=>`<td>${typeof x[k]==='object'?renderGeneric(x[k],depth+1):esc(String(x[k]??''))}</td>`).join('')}</tr>`).join('')}</table></div>`;}
    return v.map(x=>renderGeneric(x,depth+1)).join('');}
  return Object.entries(v).map(([k,x])=>`<h4>${esc(k)}</h4>${renderGeneric(x,depth+1)}`).join('');}
function viewLesson(tid){const t=pastTopic(tid);if(!t){location.hash='#/notes';return;}
  const known=new Set(['id','title','short','summary','steps','table','example','trap','drills','ref']);
  const drills=(t.drills||[]).map(d=>typeof d==='string'?d:(d&&(d.id||d.question))||'').filter(Boolean);
  const n=PASTQ.filter(q=>String(q.topic)===String(tid)).length;
  const tbl=t.table&&t.table.headers?`<h3>核心觀念</h3><div class="tablewrap"><table><tr>${t.table.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${(t.table.rows||[]).map(r=>`<tr>${(Array.isArray(r)?r:Object.values(r)).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:'';
  const extra=Object.entries(t).filter(([k])=>!known.has(k)).map(([k,v])=>`<h3>${esc(k)}</h3>${renderGeneric(v)}`).join('');
  app.innerHTML=`<p class="tiny"><a href="#/notes">← 講義</a> · <a href="#/past">考古題</a></p><h2>📘 ${esc(t.title||tid)}</h2><p class="tiny">${esc(t.short||'')}${n?` · 歷屆 ${n} 題`:''}</p>
  <div class="btnrow"><a class="btn primary" href="#/pasttopic/${esc(tid)}">練習此題型的考古題</a></div>
  <div class="notes">
    ${t.summary?`<div class="card metaphor"><span class="tag">一句話抓重點</span><p>${esc(t.summary)}</p></div>`:''}
    ${t.steps&&t.steps.length?`<div class="card def"><span class="deftag">解題順序</span><ol>${t.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}
    ${tbl}
    ${t.example?`<div class="card example"><span class="deftag">例題:${esc(t.example.title||'')}</span><p>${esc(t.example.body||'')}</p></div>`:''}
    ${t.trap?`<div class="card advanced"><span class="deftag">易錯提醒</span><p>${esc(t.trap)}</p></div>`:''}
    ${extra}
    ${t.ref?`<p class="tiny">規則參考:<a href="${esc(t.ref)}" target="_blank" rel="noopener">${esc(t.ref)}</a></p>`:''}
  </div>
  ${drills.length?`<h3>對照練習題(${drills.length})</h3><p class="tiny">教材指定的考古題;作答後顯示本站解析。</p><div id="drills"></div>`:''}`;
  drills.forEach((id,i)=>{const q=PASTQ.find(x=>x.id==='P-'+id);const box=$('#drills');if(!box)return;if(q)box.appendChild(renderQuestion(q,i));else box.insertAdjacentHTML('beforeend',`<p class="tiny">題目 ${esc(id)} 尚未載入(題庫未匯入)。</p>`);});
  window.scrollTo(0,0);}
function viewPastQ(pi){
  if(window.PAST&&!String(pi).startsWith('m')){viewPastEdition(String(pi));return;}
  pi=String(pi).replace(/^m/,'');const past=store.get('past',[]);const p=past[+pi];if(!p){location.hash='#/past';return;}
  app.innerHTML=`<p class="tiny"><a href="#/past">← 考古題</a></p><h2>${esc(p.name)}</h2><p class="tiny">沒有答案的題目會以「未提供答案」顯示,請對照官方解答補上。</p><div id="list"></div>`;
  p.q.forEach((q,i)=>{const qq={...q,id:'past-'+p.name+'-'+i,src:p.name};if(q.a<0){const d=document.createElement('div');d.className='q';d.innerHTML=`<div class="qt"><span class="qn">${i+1}</span>${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<button disabled>${'ABCD'[j]}. ${esc(o)}</button>`).join('')}</div><p class="tiny">此題未提供答案。</p>`;$('#list').appendChild(d);}else $('#list').appendChild(renderQuestion(qq,i));});}

/* ========== 錯題本 ========== */
function viewWrong(){
  const w=store.get('wrong',[]);const past=store.get('past',[]);
  const items=w.map(id=>{let q=ALLQ.find(x=>x.id===id)||PASTQ.find(x=>x.id===id);if(!q&&id.startsWith('past-')){past.forEach(p=>p.q.forEach((x,i)=>{if('past-'+p.name+'-'+i===id)q={...x,id,src:p.name};}));}return q;}).filter(Boolean);
  app.innerHTML=`<h2>錯題本</h2><p class="tiny">答錯的題目會自動收進來;再做一次答對就會移除。目前 ${items.length} 題。</p>${items.length?'<div class="btnrow"><button class="btn small" id="clr">清空錯題本</button></div>':''}<div id="list"></div>`;
  if($('#clr'))$('#clr').addEventListener('click',()=>{if(confirm('確定清空?')){store.set('wrong',[]);viewWrong();}});
  shuffle(items).forEach((q,i)=>$('#list').appendChild(renderQuestion(q,i,{showMod:true})));
}

/* ========== 速記表 ========== */
function viewCheat(){app.innerHTML=`<h2>考前速記表</h2><p class="tiny">建議列印或截圖,考前一天從頭到尾看兩遍。</p><div class="notes card">${BANK.cheat}</div>`;}

/* ========== 倒數 ========== */
function updateCountdown(){const d=store.get('examdate','');const el=$('#countdown');if(!d){el.textContent='設定考試日期';return;}const diff=Math.ceil((new Date(d+'T00:00:00')-new Date().setHours(0,0,0,0))/86400000);el.textContent=diff>0?`距考試 ${diff} 天`:diff===0?'就是今天!':'考試已過';}
$('#countdown').addEventListener('click',()=>{const v=prompt('輸入考試日期(YYYY-MM-DD):',store.get('examdate','')||'');if(v===null)return;if(/^\d{4}-\d{2}-\d{2}$/.test(v.trim()))store.set('examdate',v.trim());else if(v.trim()==='')store.set('examdate','');updateCountdown();});
updateCountdown();

/* ========== 路由 ========== */
function route(){const h=location.hash||'#/home';const [_,page,arg]=h.split('/');
  $$('#tabs a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+page||(['pastq','pasttopic','paststats'].includes(page)&&a.getAttribute('href')==='#/past')||(page==='lesson'&&a.getAttribute('href')==='#/notes')));
  if(examState&&examState.running&&page!=='exam'){if(!confirm('模擬考進行中,離開會放棄本次作答。確定離開?')){location.hash='#/exam';return;}clearInterval(examState.timer);examState=null;}
  const map={home:viewHome,plan:viewPlan,notes:()=>viewNotes(arg),practice:()=>viewPractice(arg),calc:viewCalc,vocab:viewVocab,exam:()=>viewExam(arg),past:viewPast,pastq:()=>viewPastQ(arg),pasttopic:()=>viewPastTopic(arg),paststats:viewPastStats,lesson:()=>viewLesson(arg),wrong:viewWrong,cheat:viewCheat};
  (map[page]||viewHome)();if(page!=='notes')window.scrollTo(0,0);}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
